<!doctype html>
<html lang="es">
<head>

<meta charset="utf-8">
<title>MateMonstruos · Liga del Teide</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="author" content="David OZC">
<link rel="license" href="https://creativecommons.org/licenses/by-nc-nd/4.0/">
<meta name="description" content="Juego educativo de matemáticas para Primaria, jugable con teclado, pantalla táctil o Makey Makey.">
<meta name="theme-color" content="#12063a">
<style>:root{--ink:#1b1140;--ink2:#2a1a66;--lime:#b6ff3b;--pink:#ff3d9a;--cyan:#2de2ff;--yellow:#ffd23f;--orange:#ff7a3d;--violet:#9b6bff;--white:#fff;--panel:rgba(22,10,62,.82)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(14px,1.55vmin + 7px,24px)}
html,body{margin:0;height:100%;background:#12063a;color:#fff;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{font-family:"Arial Black","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:800;letter-spacing:.01em}
#app{position:fixed;inset:0;overflow:hidden}
#bg{position:absolute;inset:0;z-index:0;transition:opacity .4s}
#bg svg{position:absolute;inset:0;width:100%;height:100%}
#bg::after,#app::after{content:"";position:absolute;inset:0;pointer-events:none}
#bg::after{background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(10,2,40,.55) 100%),radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.5px) 0 0/9px 9px}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
#screen{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;outline:none}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.tw{animation:tw 3s infinite ease-in-out}@keyframes tw{50%{opacity:.25}}
.drift{animation:drift 70s linear infinite}.drift.d2{animation-duration:46s;animation-direction:reverse}.drift.d3{animation-duration:90s}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-400px)}}
.wv{animation:wv 9s linear infinite}.wv.w2{animation-duration:7s;animation-direction:reverse}.wv.w3{animation-duration:5.5s}.wv.w4{animation-duration:4.2s;animation-direction:reverse}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-400px)}}
.pulse{animation:pls 2.2s infinite ease-in-out;transform-origin:860px 300px}@keyframes pls{50%{transform:scale(1.25);opacity:.7}}
.smoke{animation:smk 6s infinite ease-in-out}@keyframes smk{50%{transform:translate(18px,-16px)}}
.rays{animation:rays 7s infinite ease-in-out}@keyframes rays{50%{opacity:.55}}
.float{animation:flt 7s infinite ease-in-out}@keyframes flt{50%{transform:translateY(-14px)}}
.shoot{animation:sht 7s infinite linear;opacity:0}@keyframes sht{0%{transform:translate(200px,80px);opacity:0}4%{opacity:1}14%{transform:translate(700px,330px);opacity:0}100%{opacity:0}}
.aur{animation:aur 9s infinite ease-in-out}@keyframes aur{50%{transform:translateY(24px);opacity:.7}}

/* controles superiores */
#topctl{position:absolute;top:.5rem;right:.6rem;z-index:20;display:flex;gap:.45rem}
.ib{width:2.5rem;height:2.5rem;border-radius:.8rem;border:.16rem solid var(--ink);background:var(--panel);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 .2rem 0 var(--ink);padding:0}
.ib svg{width:1.3rem;height:1.3rem}
.ib:active{transform:translateY(.15rem);box-shadow:0 .05rem 0 var(--ink)}
.ib[aria-pressed=true]{background:var(--pink)}

/* botones */
button{font:inherit;color:inherit;cursor:pointer}
.btn{--c:var(--lime);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.6rem;padding:.7rem 1.5rem;min-height:3rem;border:.2rem solid var(--ink);border-radius:1.1rem;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,#fff) 0,var(--c) 55%,color-mix(in srgb,var(--c) 80%,#000) 100%);color:var(--ink);font-weight:900;font-size:1.15rem;text-transform:uppercase;letter-spacing:.04em;box-shadow:0 .38rem 0 var(--ink),0 .6rem 1.2rem rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.btn:active,.btn.press{transform:translateY(.3rem);box-shadow:0 .08rem 0 var(--ink)}
.btn.pink{--c:var(--pink);color:#fff}.btn.cyan{--c:var(--cyan)}.btn.yellow{--c:var(--yellow)}.btn.orange{--c:var(--orange)}.btn.violet{--c:var(--violet);color:#fff}
.btn.big{font-size:1.7rem;padding:.9rem 2.6rem;min-height:4rem}
.btn.ghost{--c:#3b2a8c;color:#fff}
:focus-visible,.focus{outline:none}
button:focus-visible,[data-nav]:focus-visible,button.focus{outline:.28rem solid #fff;outline-offset:.2rem;animation:ring .9s infinite alternate}
@keyframes ring{to{outline-color:var(--yellow)}}

/* textos */
.logo{font-size:clamp(2.4rem,9vmin + 1rem,6.2rem);line-height:.92;text-transform:uppercase;text-align:center;transform:rotate(-3deg);margin:0;font-weight:900;paint-order:stroke fill;-webkit-text-stroke:.14em var(--ink);text-shadow:0 .08em 0 var(--ink),0 .16em 0 var(--ink),0 .3em .5em rgba(0,0,0,.4)}
.logo .a{color:var(--lime)}.logo .b{color:var(--pink);display:block;font-size:1.12em}
.sub{display:inline-block;font-size:1.2rem;color:var(--yellow);text-transform:uppercase;letter-spacing:.16em;text-align:center;margin:.5rem 0 0;padding:.35rem 1.3rem;background:var(--ink);border:.18rem solid #fff;border-radius:2rem;box-shadow:0 .3rem 0 rgba(0,0,0,.45);transform:rotate(-1.5deg)}
h2.t{margin:0;font-size:clamp(1.5rem,5.2vmin,2.6rem);text-transform:uppercase;text-align:center;paint-order:stroke fill;-webkit-text-stroke:.12em var(--ink);text-shadow:0 .1em 0 var(--ink);color:#fff}
p.s{margin:.3rem 0 0;text-align:center;font-weight:700;color:#f1ebff;text-shadow:0 0 .5em var(--ink),0 .08em 0 var(--ink),0 0 .2em var(--ink)}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:3.4rem 1rem 1rem;min-height:0;overflow:auto;animation:scrIn .35s ease-out}
@keyframes scrIn{from{opacity:0;transform:translateY(1rem) scale(.98)}}
.row{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;align-items:stretch}
.col{display:flex;flex-direction:column;gap:.8rem;align-items:center}
.keys{font-size:.8rem;color:#d7ccff;text-align:center;opacity:.9;text-shadow:0 .08em 0 var(--ink)}
kbd{display:inline-block;min-width:1.6em;padding:.1em .45em;border:.12rem solid var(--ink);border-radius:.4em;background:#fff;color:var(--ink);font:inherit;font-size:.9em;box-shadow:0 .12em 0 var(--ink);margin:0 .1em}

/* tarjetas */
.card{--c:var(--lime);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:.45rem;width:min(15rem,29vw);min-width:10rem;padding:1rem .8rem 1.1rem;border:.22rem solid var(--ink);border-radius:1.4rem;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 55%,#fff),var(--c));color:var(--ink);text-align:center;box-shadow:0 .5rem 0 var(--ink),0 .8rem 1.5rem rgba(0,0,0,.4);transition:transform .12s;overflow:hidden}
.card:hover,.card:focus-visible{transform:translateY(-.25rem) scale(1.04)}
.card:active{transform:translateY(.2rem)}
.card .ic{width:4.2rem;height:4.2rem;border-radius:1.2rem;background:var(--ink);display:grid;place-items:center;color:var(--c)}
.card .ic svg{width:2.8rem;height:2.8rem;fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.card .nm{font-size:1.25rem;line-height:1.05;text-transform:uppercase;font-weight:900}
.card .ds{font-size:.82rem;font-weight:700;line-height:1.25;color:#2a1a66}
.card .tag{font-size:.72rem;background:var(--ink);color:#fff;border-radius:2rem;padding:.2rem .7rem;letter-spacing:.06em}
.card .best{position:absolute;top:.4rem;right:.4rem;background:var(--ink);color:var(--yellow);border-radius:.6rem;padding:.1rem .5rem;font-size:.8rem}
.card.wide{width:min(34rem,86vw);flex-direction:row;text-align:left;gap:1rem;padding:1rem 1.4rem}
.card.wide .ic{flex:none}
.card.wide .nm{font-size:1.6rem}
.cards-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.9rem;width:min(62rem,96vw)}
.cards-grid .card{width:auto;min-width:0;padding:.7rem .5rem .8rem}
.cards-grid .card .ic{width:3rem;height:3rem;border-radius:.9rem}.cards-grid .card .ic svg{width:2rem;height:2rem}
.cards-grid .card .nm{font-size:.98rem}
.lvl .eggmini{width:4.6rem;height:5.2rem;margin-top:-.2rem}

/* título */
.title-pets{display:flex;gap:1.2rem;align-items:flex-end;justify-content:center;height:clamp(6rem,22vmin,12rem)}
.title-pets .pet{height:100%;aspect-ratio:1;animation:bob 2.4s infinite ease-in-out}
.title-pets .pet:nth-child(2){height:125%;animation-delay:-.7s}.title-pets .pet:nth-child(3){animation-delay:-1.3s}
.pet svg,.sprite svg,.big-cr svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 .3rem 0 rgba(0,0,0,.25))}

/* huevos */
.eggs{display:flex;gap:clamp(.8rem,4vw,3rem);align-items:flex-end;justify-content:center}
.egg{background:none;border:0;padding:.4rem;width:clamp(6.5rem,24vmin,12rem);transition:transform .15s;position:relative}
.egg:hover,.egg:focus-visible{transform:scale(1.1)}
.egg .egg-svg{width:100%;filter:drop-shadow(0 .5rem 0 rgba(0,0,0,.25));animation:eggw 2.6s infinite ease-in-out;transform-origin:50% 90%}
.egg:nth-child(2) .egg-svg{animation-delay:-.9s}.egg:nth-child(3) .egg-svg{animation-delay:-1.7s}
@keyframes eggw{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-7deg)}80%{transform:rotate(6deg)}90%{transform:rotate(-3deg)}}
.egg.shaking .egg-svg{animation:eggs .9s ease-in forwards}
@keyframes eggs{0%{transform:rotate(0)}15%{transform:rotate(-14deg)}30%{transform:rotate(14deg)}45%{transform:rotate(-18deg) scale(1.05)}60%{transform:rotate(18deg) scale(1.1)}80%{transform:rotate(-10deg) scale(1.2)}100%{transform:scale(1.35);filter:brightness(3)}}
.egg.gone{opacity:.15;transform:scale(.8);pointer-events:none}
.reveal{display:flex;flex-direction:column;align-items:center;gap:.6rem}
.big-cr{width:clamp(10rem,36vmin,20rem);aspect-ratio:1;animation:popin .7s cubic-bezier(.2,1.8,.4,1),bob 2.4s .7s infinite ease-in-out}
.chip{display:inline-block;background:var(--ink);color:#fff;border-radius:2rem;padding:.2rem .9rem;font-size:.85rem;letter-spacing:.05em;text-transform:uppercase}
.nameplate{font-size:clamp(1.6rem,6vmin,3rem);text-transform:uppercase;color:var(--yellow);paint-order:stroke fill;-webkit-text-stroke:.14em var(--ink);text-shadow:0 .1em 0 var(--ink)}

/* criaturas / animaciones */
.sprite{position:absolute;aspect-ratio:1;transform-origin:50% 90%}
.sprite .inner{width:100%;height:100%}
.bob{animation:bob 2.2s infinite ease-in-out}
@keyframes bob{50%{transform:translateY(-4%) scale(1.02,.98)}}
.hop{animation:hop .6s ease-out}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-22%) scale(.95,1.08)}70%{transform:translateY(0) scale(1.08,.92)}100%{transform:none}}
.shake{animation:shk .5s}
@keyframes shk{0%,100%{transform:translateX(0)}15%{transform:translateX(-9%) rotate(-5deg)}35%{transform:translateX(8%) rotate(4deg)}55%{transform:translateX(-6%)}75%{transform:translateX(4%)}}
.faint{animation:fnt 1s forwards}
@keyframes fnt{to{transform:translateY(14%) rotate(88deg) scale(.9);filter:grayscale(1) brightness(.7)}}
.lunger{animation:lr .55s ease-in-out}.lungel{animation:ll .55s ease-in-out}
@keyframes lr{40%{transform:translate(55%,-18%) scale(1.1)}}
@keyframes ll{40%{transform:translate(-55%,18%) scale(1.1)}}
.popin{animation:popin .6s cubic-bezier(.2,1.8,.4,1)}
@keyframes popin{from{transform:scale(0) rotate(-20deg)}}
.spinout{animation:spo 1s ease-in forwards}
@keyframes spo{to{transform:scale(0) rotate(720deg);opacity:0}}
.flash{animation:fl .4s}@keyframes fl{30%{filter:brightness(4) saturate(0)}}
.enter-r{animation:enr .7s cubic-bezier(.2,1.2,.4,1)}@keyframes enr{from{transform:translateX(120%)}}
.aura{animation:aur2 1.6s infinite ease-in-out;transform-origin:100px 112px}@keyframes aur2{50%{transform:scale(1.12);opacity:.6}}
.spark{animation:spk 1.4s infinite}.spark.s2{animation-delay:-.7s}@keyframes spk{50%{transform:scale(1.6);opacity:.4}}
.pet svg .spark,.sprite svg .spark{transform-box:fill-box;transform-origin:center}

/* batalla */
.battle{flex:1;display:flex;flex-direction:column;min-height:0;padding-top:0}
.hud{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.5rem 9.4rem .3rem .7rem;z-index:5}
.hud .hl,.hud .hr{display:flex;align-items:center;gap:.6rem}
.hearts{display:flex;gap:.1rem}
.hearts svg{width:1.8rem;height:1.8rem;filter:drop-shadow(0 .1rem 0 var(--ink))}
.hearts svg.lost{opacity:.35;filter:grayscale(1)}
.hearts svg.pop{animation:hbk .7s}@keyframes hbk{30%{transform:scale(1.7) rotate(12deg)}100%{transform:scale(1)}}
.hpill{background:var(--panel);border:.16rem solid var(--ink);border-radius:1rem;padding:.15rem .8rem;font-size:.9rem;white-space:nowrap}
.score{font-size:1.5rem;color:var(--yellow);paint-order:stroke fill;-webkit-text-stroke:.12em var(--ink);text-shadow:0 .1em 0 var(--ink);min-width:5ch;text-align:right}
.streak{color:var(--lime)}
.streak.hot{color:var(--orange);animation:pls2 .5s infinite alternate}@keyframes pls2{to{transform:scale(1.12)}}
.arena{position:relative;flex:1 1 45%;min-height:0}
.foe{left:auto;right:11%;top:4%;height:74%}
.me{left:11%;bottom:2%;height:72%}
.shadow{position:absolute;bottom:-3%;left:12%;width:76%;height:9%;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(2px)}
.plate{position:absolute;background:var(--panel);border:.18rem solid var(--ink);border-radius:1rem;padding:.35rem .8rem;width:min(17rem,30%);box-shadow:0 .25rem 0 var(--ink)}
.plate .pn{display:flex;justify-content:space-between;gap:.5rem;font-size:.95rem;text-transform:uppercase;line-height:1.1}.plate .pn span:first-child{min-width:0}
.plate .pe{font-size:.7rem;background:var(--ink);padding:.05rem .5rem;border-radius:1rem;color:var(--cyan)}
.fplate{left:2%;top:3%}.mplate{right:2%;bottom:7%}
.hp{height:.8rem;margin-top:.3rem;background:#12063a;border:.14rem solid var(--ink);border-radius:1rem;overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(180deg,#d6ff7a,#6fd11c);transition:width .5s}
.hp.boss i{background:linear-gradient(180deg,#ff8aa8,#e0143c)}
.hp.low i{background:linear-gradient(180deg,#ffd27a,#ff7a1a)}
.bossTag{background:var(--pink);color:#fff;border-radius:.5rem;padding:0 .4rem;margin-right:.3rem;font-size:.7rem}
.qpanel{flex:1 1 55%;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:". up ." "left q right" ". down .";gap:.55rem;padding:.3rem .7rem .7rem;width:min(70rem,100%);margin:0 auto;z-index:4}
.qcard{grid-area:q;position:relative;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;background:var(--panel);border:.22rem solid var(--ink);border-radius:1.4rem;padding:.6rem .8rem;box-shadow:inset 0 0 0 .14rem rgba(255,255,255,.18),0 .4rem 0 var(--ink);overflow:hidden;text-align:center}
.qcat{position:absolute;top:.4rem;left:.5rem;font-size:.68rem;border-radius:2rem;padding:.12rem .7rem;color:var(--ink);background:var(--c,var(--lime));text-transform:uppercase;letter-spacing:.05em}
.qtext{font-size:clamp(1.1rem,3.6vmin,2rem);line-height:1.15;font-weight:900;margin-top:.8rem;max-width:100%}
.qtext.long{font-size:clamp(.95rem,2.6vmin,1.4rem);font-weight:800}
.qtext.eq{font-size:clamp(1.6rem,6.4vmin,3.4rem);letter-spacing:.04em}
.qvis{display:flex;align-items:center;justify-content:center;max-width:100%;min-height:0;flex:0 1 auto}
.qvis svg.fig{height:clamp(4rem,17vmin,9rem);width:auto;max-width:100%;filter:drop-shadow(0 .15rem 0 rgba(0,0,0,.3))}
.qvis svg.fig.wide{height:clamp(3.4rem,14vmin,7rem)}
.qvis svg.grid{height:clamp(5rem,24vmin,12rem)}
.qvis svg .dim{fill:#fff;font:900 17px "Arial Black",sans-serif;paint-order:stroke;stroke:#1b1140;stroke-width:4.5px}
.qvis .duo{display:flex;gap:1.2rem;align-items:center}
.qvis .duo svg{height:clamp(3.6rem,15vmin,8rem)}
.seq{display:flex;gap:.45rem;flex-wrap:wrap;justify-content:center}
.seq b{min-width:2.3em;padding:.2em .35em;border-radius:.6em;background:#fff;color:var(--ink);font-size:clamp(1.2rem,4.6vmin,2.4rem);border:.14rem solid var(--ink);box-shadow:0 .12em 0 var(--ink)}
.seq b.miss{background:var(--yellow);animation:pls2 .7s infinite alternate}
.seq.tokens{gap:.15rem}.seq.tokens .tok{width:clamp(2.2rem,9vmin,4.2rem);height:clamp(2.2rem,9vmin,4.2rem)}
.tok.q{display:grid;place-items:center;font-size:2rem;color:var(--yellow);width:clamp(1.8rem,7vmin,3.4rem);animation:pls2 .7s infinite alternate}
.blank{display:inline-block;min-width:1.2em;border-bottom:.12em dashed var(--yellow);color:var(--yellow);animation:pls2 .7s infinite alternate}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 .1em}
.fr i{font-style:normal;padding:0 .2em}.fr i:first-child{border-bottom:.1em solid currentColor;padding-bottom:.08em}.fr i:last-child{padding-top:.08em}
.ans{--c:var(--cyan);position:relative;display:flex;align-items:center;justify-content:center;gap:.4rem;min-height:3.1rem;min-width:0;padding:.4rem .5rem;border:.2rem solid var(--ink);border-radius:1.1rem;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 60%,#fff),var(--c));color:var(--ink);font-weight:900;font-size:clamp(1rem,3.4vmin,1.9rem);box-shadow:0 .35rem 0 var(--ink);transition:transform .08s,box-shadow .08s,opacity .3s}
.ans:active{transform:translateY(.28rem);box-shadow:0 .07rem 0 var(--ink)}
.ans[data-dir=up]{grid-area:up;--c:var(--cyan)}.ans[data-dir=left]{grid-area:left;--c:var(--lime)}.ans[data-dir=right]{grid-area:right;--c:var(--yellow)}.ans[data-dir=down]{grid-area:down;--c:var(--pink);color:#fff}
.ans svg.a{flex:none;width:1.1em;height:1.1em;fill:var(--ink);opacity:.65}
.ans[data-dir=down] svg.a{fill:#fff}
.ans .av{display:flex;align-items:center;justify-content:center;min-width:0;text-align:center;line-height:1.05;overflow-wrap:anywhere}
.ans .av svg{height:2.2em;width:auto;max-width:100%}
.ans .av .fr{font-size:1.05em}
.ans.long{font-size:clamp(.78rem,2.3vmin,1.15rem)}
.ans.ok{--c:#4cff6a!important;animation:okp .5s}
@keyframes okp{40%{transform:scale(1.12)}}
.ans.bad{--c:#ff4d4d!important;color:#fff;animation:shk2 .4s}
@keyframes shk2{25%{transform:translateX(-.5rem)}75%{transform:translateX(.5rem)}}
.ans.dim{opacity:.3}
.ans:disabled{cursor:default}
.hintcard{display:flex;flex-direction:column;gap:.5rem;align-items:center;animation:popin .35s}
.hintcard .oops{font-size:1.5rem;color:var(--orange);text-transform:uppercase}
.hintcard .ht{font-size:clamp(.95rem,2.8vmin,1.5rem);font-weight:800;line-height:1.25}
.hintcard .ht svg{height:1.5em;width:auto;vertical-align:middle}
.hintcard .go{font-size:.8rem;color:var(--cyan)}
.banner{position:absolute;left:0;right:0;top:34%;z-index:12;text-align:center;pointer-events:none}
.banner .bt{display:inline-block;font-size:clamp(1.8rem,8vmin,4.4rem);text-transform:uppercase;line-height:1;color:var(--yellow);paint-order:stroke fill;-webkit-text-stroke:.16em var(--ink);text-shadow:0 .1em 0 var(--ink),0 .3em .6em rgba(0,0,0,.5);transform:rotate(-3deg);animation:ban 1.7s forwards}
.banner .bs{display:block;margin-top:.5rem;font-size:clamp(1rem,3.4vmin,1.8rem);color:#fff;text-shadow:0 .1em 0 var(--ink);animation:ban 1.7s forwards}
.banner.boss .bt{color:#ff4d6d;animation-duration:2.4s;font-size:clamp(2.2rem,10vmin,5.6rem)}
.banner.boss .bs{animation-duration:2.4s}
@keyframes ban{0%{opacity:0;transform:scale(2.4) rotate(-10deg)}12%{opacity:1;transform:scale(1) rotate(-3deg)}80%{opacity:1}100%{opacity:0;transform:translateY(-1rem) scale(.9) rotate(-3deg)}}

<div id="app">
  <div id="bg" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="topctl"></div>
  <main id="screen" tabindex="-1"></main>

<noscript>Este juego necesita JavaScript.</noscript>
<script>/* MateMonstruos · motor de preguntas
   Generadores paramétricos por categoría y ciclo. d = dificultad 0..1 dentro del ciclo. */
(function (G) {
'use strict';

/* ---------- utilidades ---------- */
const R = {
  int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: a => a[Math.floor(Math.random() * a.length)],
  chance: p => Math.random() < p,
  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  lerp: (d, a, b) => Math.round(a + (b - a) * d)
};
const nf = new Intl.NumberFormat('es-ES');
const D = n => String(Math.round(n * 1000) / 1000).replace('.', ',');
const N = n => Number.isInteger(n) ? (Math.abs(n) >= 10000 ? nf.format(n) : String(n)) : D(n);
const F = (n, d) => `<span class="fr"><i>${n}</i><i>${d}</i></span>`;
const BLANK = '<span class="blank">?</span>';
const gcd = (a, b) => b ? gcd(b, a % b) : a;

function numWrong(c, extra) {
  const m = Math.abs(c) < 10 ? [1, 2, 3] : Math.abs(c) < 100 ? [1, 2, 10, 5] : Math.abs(c) < 1000 ? [1, 10, 100, 2] : [1, 10, 100, 1000];
  const out = [];
  m.forEach(s => out.push(c + s, c - s));
  (extra || []).forEach(x => out.push(x));
  return out.filter(v => Number.isFinite(v) && v >= 0 && v !== c && (Number.isInteger(v) || !Number.isInteger(c))).map(N);
}

function build(o) {
  const bad = s => s == null || /NaN|undefined|Infinity/.test(String(s));
  if (bad(o.correct) || bad(o.text)) return null;
  const seen = new Set([o.correct]); const opts = [o.correct];
  const max = o.n || 4, min = o.min || 3;
  for (const w of R.shuffle(o.wrong || [])) {
    if (bad(w) || seen.has(w)) continue;
    seen.add(w); opts.push(w);
    if (opts.length >= max) break;
  }
  if (opts.length < min) return null;
  const order = o.keepOrder ? opts : R.shuffle(opts);
  return { cat: o.cat, text: o.text, visual: o.visual || '', answers: order, correct: order.indexOf(o.correct), hint: o.hint || '', key: o.key || (o.cat + '|' + o.text + '|' + o.correct), big: !!o.big };
}

/* ---------- SVG ---------- */
const INK = '#1b1140';
const TCOL = ['#ff3d9a', '#2de2ff', '#b6ff3b', '#ffd23f', '#ff7a3d', '#9b6bff'];
const svg = (vb, inner, cls) => `<svg viewBox="${vb}" class="${cls || ''}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
const ngon = (n, cx, cy, r, rot) => { rot = rot == null ? (n % 2 === 0 ? -90 + 180 / n : -90) : rot; let p = []; for (let i = 0; i < n; i++) { const a = (rot + 360 * i / n) * Math.PI / 180; p.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1)); } return p.join(' '); };
const starPts = (cx, cy, R1, R2, n) => { let p = []; for (let i = 0; i < n * 2; i++) { const r = i % 2 ? R2 : R1, a = (-90 + 180 * i / n) * Math.PI / 180; p.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1)); } return p.join(' '); };
const STW = `stroke="#fff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"`;
const ST = `stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;

function tok(shape, col) {
  let p;
  switch (shape) {
    case 'circle': p = '<circle cx="20" cy="20" r="14"/>'; break;
    case 'square': p = '<rect x="6" y="6" width="28" height="28" rx="4"/>'; break;
    case 'triangle': p = '<polygon points="20,5 35,33 5,33"/>'; break;
    case 'star': p = `<polygon points="${starPts(20, 21, 17, 7.5, 5)}"/>`; break;
    case 'diamond': p = '<polygon points="20,3 36,20 20,37 4,20"/>'; break;
    default: p = '<path d="M20 35 C4 24 4 10 13 9 C17 9 19 12 20 14 C21 12 23 9 27 9 C36 10 36 24 20 35Z"/>';
  }
  return svg('0 0 40 40', `<g fill="${col}" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round">${p}</g>`, 'tok');
}
const TSHAPES = ['circle', 'square', 'triangle', 'star', 'diamond', 'heart'];

/* figuras 2D / 3D (120x120) */
function shape2d(name, col) {
  col = col || R.pick(TCOL);
  const f = `fill="${col}" ${ST}`;
  const m = {
    circulo: `<circle cx="60" cy="60" r="44" ${f}/>`,
    cuadrado: `<rect x="18" y="18" width="84" height="84" rx="3" ${f}/>`,
    rectangulo: `<rect x="8" y="34" width="104" height="52" rx="3" ${f}/>`,
    triangulo: `<polygon points="60,12 108,100 12,100" ${f}/>`,
    rombo: `<polygon points="60,8 106,60 60,112 14,60" ${f}/>`
  };
  return svg('0 0 120 120', m[name], 'fig');
}
function solid(name) {
  const c1 = '#ff3d9a', c2 = '#2de2ff', c3 = '#ffd23f';
  const m = {
    esfera: `<defs><radialGradient id="gs" cx="35%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="${c2}"/><stop offset="1" stop-color="#1668c9"/></radialGradient></defs><circle cx="60" cy="62" r="46" fill="url(#gs)" ${ST}/>`,
    cubo: `<polygon points="60,10 104,34 60,58 16,34" fill="${c3}" ${ST}/><polygon points="16,34 60,58 60,110 16,86" fill="${c1}" ${ST}/><polygon points="104,34 60,58 60,110 104,86" fill="#b3126a" ${ST}/>`,
    cono: `<ellipse cx="60" cy="96" rx="40" ry="14" fill="#ff7a3d" ${ST}/><polygon points="60,10 20,96 100,96" fill="#ff7a3d" ${ST}/><ellipse cx="60" cy="96" rx="40" ry="14" fill="#ffa266" ${ST}/>`,
    cilindro: `<rect x="20" y="28" width="80" height="68" fill="#b6ff3b" ${ST}/><ellipse cx="60" cy="96" rx="40" ry="14" fill="#b6ff3b" ${ST}/><rect x="22" y="28" width="76" height="66" fill="#b6ff3b"/><ellipse cx="60" cy="28" rx="40" ry="14" fill="#e4ff9e" ${ST}/>`,
    piramide: `<polygon points="60,8 18,86 60,106" fill="#ffd23f" ${ST}/><polygon points="60,8 60,106 104,80" fill="#e0a800" ${ST}/>`
  };
  return svg('0 0 120 120', m[name], 'fig');
}
function polyFig(n, col, rot) { return svg('0 0 120 120', `<polygon points="${ngon(n, 60, 62, 48, rot)}" fill="${col || R.pick(TCOL)}" ${ST}/>`, 'fig'); }

/* ---------- SUMAS Y RESTAS ---------- */
const NAMES = ['Ayoze', 'Naira', 'Yeray', 'Candela', 'Dácil', 'Airam', 'Acaymo', 'Nauzet', 'Kenia', 'Beneharo'];
const THINGS = [['plátanos', 'm'], ['papas', 'f'], ['cabras', 'f'], ['barcos', 'm'], ['cometas', 'f'], ['conchas', 'f'], ['lagartos', 'm'], ['gaviotas', 'f'], ['piedras', 'f'], ['sandías', 'f'], ['pegatinas', 'f'], ['tomates', 'm']];
const Cuan = g => g === 'f' ? 'Cuántas' : 'Cuántos';

function sumres(c, d) {
  const kind = (c === 1 && d < .3) ? R.pick(['sum', 'sub', 'sum', 'sub', 'miss']) : R.pick(['sum', 'sub', 'miss', 'prob', 'prob']);
  if (c === 3 && d > .5 && R.chance(.35)) {
    const a = R.int(11, 899) / 10, b = R.int(11, 899) / 10, sub = R.chance(.5);
    const x = sub ? Math.max(a, b) : a, y = sub ? Math.min(a, b) : b;
    if (x === y) return null;
    const ans = Math.round((sub ? x - y : x + y) * 10) / 10;
    const w = [ans + .1, ans - .1, ans + 1, ans - 1, ans + 10, ans - 10, Math.round((sub ? x + y : Math.abs(x - y)) * 10) / 10].filter(v => v >= 0 && v !== ans).map(D);
    return build({ cat: 'sumres', text: `${D(x)} ${sub ? '−' : '+'} ${D(y)} = ?`, correct: D(ans), wrong: w, hint: `Alinea las comas: ${D(x)} ${sub ? '−' : '+'} ${D(y)} = ${D(ans)}` });
  }
  let max;
  if (c === 1) max = d < .2 ? 10 : d < .45 ? 20 : d < .75 ? 50 : 100;
  else if (c === 2) max = R.lerp(d, 300, 9999);
  else max = d < .4 ? R.lerp(d, 1000, 99999) : 999999;
  const lo = c === 1 ? 1 : Math.max(2, Math.floor(max / 10));
  const sub = kind === 'sub' || ((kind === 'miss' || kind === 'prob') && R.chance(.5));
  let a, b, s;
  if (!sub) {
    a = R.int(lo, c === 1 ? max - 1 : Math.floor(max * .7));
    b = R.int(lo, c === 1 ? Math.max(1, max - a) : Math.floor(max * .7));
    s = a + b;
  } else {
    s = R.int(c === 1 ? 2 : lo * 2, max);
    a = R.int(c === 1 ? 1 : lo, s - (c === 1 ? 1 : lo));
    if (a >= s) return null;
    b = s - a;
  }
  // sum: a+b=s ; sub: s-a=b
  let text, ans, hint;
  if (kind === 'sum' || kind === 'sub') {
    if (!sub) { text = `${N(a)} + ${N(b)} = ?`; ans = s; hint = `${N(a)} + ${N(b)} = ${N(s)}`; }
    else { text = `${N(s)} − ${N(a)} = ?`; ans = b; hint = `${N(s)} − ${N(a)} = ${N(b)}`; }
  } else if (kind === 'miss') {
    if (!sub) { text = `${N(a)} + ${BLANK} = ${N(s)}`; ans = b; hint = `Lo que falta: ${N(s)} − ${N(a)} = ${N(b)}`; }
    else { text = `${N(s)} − ${BLANK} = ${N(b)}`; ans = a; hint = `Lo que falta: ${N(s)} − ${N(b)} = ${N(a)}`; }
  } else {
    const [u, g] = R.pick(THINGS), n1 = R.pick(NAMES), n2 = R.pick(NAMES.filter(x => x !== n1));
    if (!sub) {
      text = R.pick([
        `${n1} tiene ${N(a)} ${u} y ${n2} tiene ${N(b)}. ¿${Cuan(g)} ${u} tienen entre los dos?`,
        `En una cesta hay ${N(a)} ${u} y en otra hay ${N(b)}. ¿${Cuan(g)} ${u} hay en total?`,
        `${n1} tenía ${N(a)} ${u} y encuentra ${N(b)} más. ¿${Cuan(g)} ${u} tiene ahora?`]);
      ans = s; hint = `Suma: ${N(a)} + ${N(b)} = ${N(s)}`;
    } else {
      text = R.pick([
        `${n1} tenía ${N(s)} ${u} y regala ${N(a)}. ¿${Cuan(g)} ${u} le quedan?`,
        `En el puerto había ${N(s)} ${u} y se llevan ${N(a)}. ¿${Cuan(g)} quedan?`,
        `${n1} tiene ${N(s)} ${u} y ${n2} tiene ${N(a)}. ¿${Cuan(g)} ${u} más tiene ${n1}?`]);
      ans = b; hint = `Resta: ${N(s)} − ${N(a)} = ${N(b)}`;
    }
  }
  return build({ cat: 'sumres', text, correct: N(ans), wrong: numWrong(ans, [a + b, Math.abs(a - b), s + a]), hint });
}

/* ---------- TABLAS ---------- */
function mulHint(a, b) {
  const p = a * b;
  if (b > 5) return `${a} × ${b} = ${a} × 5 + ${a} × ${b - 5} = ${a * 5} + ${a * (b - 5)} = ${p}`;
  return `${a} × ${b} = ${Array(b).fill(a).join(' + ')} = ${p}`;
}
function tablas(c, d) {
  if (c === 2) {
    const pool = d < .3 ? [2, 5, 10] : d < .6 ? [2, 3, 4, 5, 10] : [2, 3, 4, 5, 6, 7, 8, 9, 10];
    const a = R.pick(pool), b = R.int(2, d < .3 ? 5 : 10), p = a * b;
    const form = R.pick(['mul', 'mul', 'mul', 'miss', 'miss', 'prob', 'dbl']);
    const w = [a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b, a + b, p + a, p - a, p + b, p - b];
    if (form === 'mul') return build({ cat: 'tablas', text: `${a} × ${b} = ?`, correct: N(p), wrong: w.filter(x => x > 0 && x !== p).map(N).concat(numWrong(p)), hint: mulHint(a, b) });
    if (form === 'miss') {
      const left = R.chance(.5);
      return build({ cat: 'tablas', text: left ? `${a} × ${BLANK} = ${p}` : `${BLANK} × ${b} = ${p}`, correct: N(left ? b : a), wrong: numWrong(left ? b : a, [a, b, p / 2 | 0]), hint: `${p} ÷ ${left ? a : b} = ${left ? b : a}, porque ${a} × ${b} = ${p}` });
    }
    if (form === 'dbl') {
      const n = R.int(3, d < .5 ? 20 : 50), t = R.chance(.5);
      const ans = n * (t ? 2 : 3);
      return build({ cat: 'tablas', text: `¿Cuál es el ${t ? 'doble' : 'triple'} de ${n}?`, correct: N(ans), wrong: numWrong(ans, [n + (t ? 2 : 3), n * (t ? 3 : 2)]), hint: `${t ? 'Doble' : 'Triple'} de ${n}: ${n} × ${t ? 2 : 3} = ${ans}` });
    }
    const [u, g] = R.pick(THINGS);
    return build({ cat: 'tablas', text: `Hay ${a} cajas con ${b} ${u} cada una. ¿${Cuan(g)} ${u} hay en total?`, correct: N(p), wrong: w.filter(x => x > 0 && x !== p).map(N).concat(numWrong(p)), hint: `${a} × ${b} = ${p}` });
  }
  // ciclo 3

      anim($('foe').querySelector('.inner'), 'shake', 500); anim($('foe'), 'flash', 400);
      floatText('+' + pts + (turbo > 40 ? ' ¡TURBO!' : ''), $('foe'));
      if (S.streak >= 3 && S.streak % 3 === 0) { banner(`¡RACHA ×${m}!`, '', false, 1000); }
      await sleep(520);
      if (S.hp > 0) setFoe();
      if (S.stage === 1 && S.correct >= S.evo2) await evolve(2); else if (S.stage === 2 && S.correct >= S.evo3) await evolve(3);
      if (S.hp > 0) setMe();
      await sleep(180);
    } else {
      S.streak = 0; S.wrong++; S.dyn = Math.max(-.2, S.dyn - .07); S.lives--;
      btns.forEach((b, j) => b.classList.add(j === i ? 'bad' : j === q.correct ? 'ok' : 'dim'));
      sfx('wrong'); setHud(); try { navigator.vibrate && navigator.vibrate(120); } catch (e) {}
      await sleep(420);
      anim($('foe'), 'lungel', 560); await sleep(220);
      const to = await orb($('foe'), $('me'), '#ff3d6a', 300); sfx('heart'); shakeScreen(); FX.burst(to[0], to[1], ['#ff3d6a', '#fff', '#ffd23f'], 18, 7);
      setMe('hurt'); anim($('me').querySelector('.inner'), 'shake', 500); setHearts(S.lives); floatText('−1', $('me'), '#ff6a8a'); setHud();
      if (S.lives <= 0) {
        setMe('faint'); $('me').querySelector('.inner').classList.remove('bob'); anim($('me').querySelector('.inner'), 'faint', 1100); sfx('lose');
        banner('¡Sin vidas!', 'Tu criatura necesita descansar', false, 1700); await sleep(1900); S.q = null; return S.resolveAsk();
      }
      setMe();
      // pista
      const card = $('qcard');
      card.innerHTML = `<div class="hintcard"><span class="oops">${S.timedOut ? '¡Se acabó el tiempo!' : '¡Casi!'} La respuesta era ${strip(q.answers[q.correct]) || '…'}</span><div class="ht">${q.hint}</div><span class="go">Pulsa <b>ESPACIO</b> o toca para seguir</span></div>`;
      if (!strip(q.answers[q.correct])) card.querySelector('.oops').textContent = '¡Casi! Fíjate bien en la figura correcta';
      S.hintAt = performance.now(); S.timedOut = false;
      await new Promise(r => { let t; S.resume = () => { clearTimeout(t); S.resume = null; r(); }; t = setTimeout(() => { if (S && S.resume) S.resume(); }, 7000); card.onclick = () => { if (performance.now() - S.hintAt > 400 && S.resume) S.resume(); }; });
    }
    S.q = null; S.resolveAsk && S.resolveAsk();
  } catch (e) { if (e !== CANCEL) throw e; }
}
async function sleepSafe(ms) { return sleep(ms); }
async function evolve(n) {
  S.stage = n; const wo = document.createElement('div'); wo.className = 'whiteout'; document.body.appendChild(wo); setTimeout(() => wo.remove(), 950);
  sfx('evolve'); setMe('happy'); anim($('me'), 'popin', 700); const c = center($('me')); FX.burst(c[0], c[1], ['#fff', '#ffd23f', '#ff3d9a', '#2de2ff'], 70, 11); FX.confetti(30);
  banner('¡EVOLUCIÓN!', `${S.me.name} sube al nivel ${n}`, false, 1700); live(S.me.name + ' evoluciona'); await sleep(1500);
}
async function won() {
  const e = S.enc, boss = !!e.title, my = tok;
  setFoe('faint'); const inner = $('foe').querySelector('.inner'); inner.classList.remove('bob');
  await sleep(450);
  if (!boss) {
    anim(inner, 'spinout', 1000); sfx('capture'); const c = center($('foe')); FX.burst(c[0], c[1], ['#fff', '#b6ff3b', '#ffd23f', '#2de2ff'], 50, 10);
    const isNew = !SAVE.dex.some(d => d.s === e.foe.seed); S.tamed.push({ cr: e.foe, isNew });
    if (isNew) { SAVE.dex.push({ s: e.foe.seed, e: e.foe.element }); if (SAVE.dex.length > 80) SAVE.dex.shift(); save(); }
    S.score += 200; S.bonus.enc += 200; setHud();
    banner(`¡${e.foe.name} domado!`, isNew ? 'Nueva criatura en tu colección' : '', false, 1500); floatText('+200', $('foe'), '#ffd23f'); await sleep(1500);
  } else {
    anim(inner, 'spinout', 1200); sfx('win'); FX.confetti(120); const c = center($('foe')); FX.burst(c[0], c[1], ['#fff', '#ffd23f', '#ff3d9a'], 90, 13);
    S.score += 500; S.bonus.boss += 500; const heal = S.lives < S.maxLives; if (heal) { S.lives++; setHearts(); }
    const isNew = !SAVE.dex.some(d => d.s === e.foe.seed); S.tamed.push({ cr: e.foe, isNew });
    if (isNew) { SAVE.dex.push({ s: e.foe.seed, e: e.foe.element }); if (SAVE.dex.length > 80) SAVE.dex.shift(); save(); }
    setHud(); banner('¡JEFE DERROTADO!', '+500 puntos' + (heal ? ' · ¡+1 corazón!' : ''), true, 2300); floatText('+500', $('foe'), '#ffd23f'); if (heal) setTimeout(() => sfx('heal'), 500); await sleep(2400);
  }
}
function pauseGame() {
  if (!S || S.paused || UI.screen !== 'battle') return;
  S.paused = true; modal(`<h3>Pausa</h3><p>Puntos: ${S.score.toLocaleString('es-ES')} · Vidas: ${S.lives}/${S.maxLives}</p><div class="row"><button class="btn" data-nav data-first data-act="resume">Continuar</button><button class="btn ghost" data-nav data-act="quit">Salir al menú</button></div>`);
}
function resumeGame() { if (S) S.paused = false; closeModal(); }
function quitRun() { clearInterval(timerId); tok++; S = null; closeModal(); document.getElementById('topctl').dataset.mode = ''; modeScreen(); curTrack = ''; musicFor('menu'); }

/* ---------- resultados ---------- */
function rate(done) {
  const acc = S.correct / Math.max(1, S.answered);
  if (done) { if (acc >= .95 && S.lives >= S.maxLives - 1) return ['S', 5, '¡Leyenda de la Liga!']; if (acc >= .85) return ['A', 4, 'Domador Estrella']; if (acc >= .7) return ['B', 3, 'Entrenador Valiente']; return ['C', 2, 'Aprendiz en Camino']; }
  return S.correct / S.totalNeed >= .6 ? ['C', 2, 'Aprendiz en Camino'] : ['D', 1, 'Cría con Mucho Futuro'];
}
function finish(done) {
  tok++; const my = tok; AU.stopMusic(); curTrack = '';
  const [letter, stars, title] = rate(done), livesB = done ? S.lives * 300 : 0, compB = done ? 1000 : 0, total = S.score + livesB + compB;
  const key = S.cycle + '|' + (S.mode === 'story' ? 'story' : S.cat), prev = SAVE.best[key], isBest = !prev || total > prev.score;
  if (isBest) SAVE.best[key] = { score: total, letter }; save();
  const acc = Math.round(100 * S.correct / Math.max(1, S.answered));
  if (done) { sfx('win'); FX.confetti(160); } else sfx('lose');
  document.getElementById('topctl').dataset.mode = '';
  const name = S.mode === 'story' ? 'Modo historia' : Q.info(S.cat, S.cycle).name;
  const st = Object.keys(S.stats).map(c => { const s = S.stats[c], t = s.c + s.w; return `<div><span>${Q.info(c, S.cycle).name}</span><b>${s.c}/${t}</b></div>`; }).join('');
  show('results', `<div class="rating"><span class="chip">${done ? '¡Misión cumplida!' : 'Entrenamiento terminado'} · ${name}</span><div class="letter">${letter}</div><div class="stars">${Array.from({ length: 5 }, (_, i) => i < stars ? STAR : STAR_OFF).join('')}</div><div class="rtitle">${title}</div></div>
  <div class="stats"><div><span>Aciertos</span><b>${S.correct}/${S.answered}</b></div><div><span>Precisión</span><b>${acc}%</b></div><div><span>Mejor racha</span><b>${S.best}</b></div><div><span>Vidas</span><b>${S.lives}/${S.maxLives}</b></div><div><span>Puntos de combate</span><b>${(S.score - S.bonus.enc - S.bonus.boss).toLocaleString('es-ES')}</b></div><div><span>Criaturas y jefes</span><b>+${S.bonus.enc + S.bonus.boss}</b></div>${done ? `<div><span>Corazones</span><b>+${livesB}</b></div><div><span>Misión</span><b>+${compB}</b></div>` : ''}<div class="tot"><span>TOTAL ${isBest ? '<span class="newb">¡RÉCORD!</span>' : ''}</span><b>${total.toLocaleString('es-ES')}</b></div></div>
  ${S.tamed.length ? `<div class="minipets">${S.tamed.map((t, i) => `<div title="${t.cr.name}">${C.svg(t.cr, { mood: 'happy', uid: 'r' + i })}</div>`).join('')}</div>` : ''}
  <div class="row"><button class="btn" data-nav data-first data-act="again">Jugar otra vez</button><button class="btn cyan" data-nav data-act="menu">Cambiar modo</button><button class="btn ghost" data-nav data-act="home">Inicio</button></div>`, { noFocus: false });
  live(`Calificación ${letter}. ${title}. ${S.correct} aciertos de ${S.answered}. Total ${total} puntos`);
  window.__last = { letter, total, acc, done, stats: S.stats };
  setTimeout(() => { UI.audioOn && AU.startMusic('menu', P.world); curTrack = 'menu' + P.world; }, 2600);
  S.ended = true;
}

/* ---------- arranque ---------- */
function boot() {
  FX.init(); FX.setWorld(P.world);
  const tc = document.getElementById('topctl');
  tc.innerHTML = `<button class="ib" id="bpause" aria-label="Pausa" data-act="pause" style="display:none">${I.pause}</button><button class="ib" id="bmute" aria-label="Sonido" aria-pressed="${AU.isMuted()}" onclick="void 0">${AU.isMuted() ? I.muteOff : I.mute}</button><button class="ib" aria-label="Pantalla completa" data-act="full">${I.full}</button>`;
  document.getElementById('bmute').addEventListener('click', toggleMute);
  new MutationObserver(() => { document.getElementById('bpause').style.display = tc.dataset.mode === 'battle' ? '' : 'none'; }).observe(tc, { attributes: true });
  titleScreen();
}
window.MM = { showQ: q => { if (S) { S.q = q; renderQuestion(q); } }, act, P, get S() { return S; }, Q, SAVE };
boot();
})();
</script>
